name: trycatch
description: "Ground station software for model rockets developed by Testing in Production"
publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.13.1

dependencies:
    flutter:
        sdk: flutter

    flutter_riverpod: ^3.4.2

    fl_chart: ^1.2.0

    flutter_map: ^8.3.1
    latlong2: ^0.10.1

    flutter_libserialport: ^0.6.0

    shared_preferences: ^2.3.2
    path_provider: ^2.1.5
    window_manager: ^0.5.2
    tray_manager: ^0.5.3
    flutter_launcher_icons: ^0.14.4

    serial:
        path: packages/serial

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0

flutter:
    uses-material-design: true

    assets:
        - assets/icon.png
        - assets/icon.ico

flutter_launcher_icons:
    image_path: "assets/icon.png"
    windows:
        generate: true
        image_path: "assets/icon.png"
    macos:
        generate: true
        image_path: "assets/icon.png"
