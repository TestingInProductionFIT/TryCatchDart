name: CI

# Manual only: tests no longer run on every push - they gate releases instead
# (see the `test` job in release.yml). Run this by hand from the Actions tab
# when you want a check outside a release.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  analyze-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub get --directory=packages/dead_reckoning
          flutter pub get --directory=packages/serial

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test dead_reckoning (pure Dart)
        run: dart test
        working-directory: packages/dead_reckoning
